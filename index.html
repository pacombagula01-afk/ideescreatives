<style>
/* ============================================================
   IDÉES CRÉATIVES — Communication · Audiovisuel · Conseil ·
   Formation · Événementiel  (République Démocratique du Congo)
   Palette et logo issus de l'identité visuelle fournie.
   Sections modulaires -> transposables en template parts WordPress.
   ============================================================ */
:root{
  --vert:      #009C3C;   /* vert de marque (primaire)      */
  --vert-fonce:#0A3B22;   /* vert profond (fonds sombres)   */
  --or:        #FCC000;   /* or de marque (accent)          */
  --rouge:     #E41818;   /* rouge de marque (ponctuel)     */
  --creme:     #F6F3EA;   /* fond papier chaud              */
  --creme-2:   #ECE7D8;   /* papier ombré                   */
  --encre:     #14231A;   /* texte (vert quasi-noir)        */
  --ardoise:   #5E6B60;   /* légendes / muted               */

  --pad: clamp(1.25rem, 5vw, 6rem);
  --maxw: 1240px;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"Hanken Grotesk", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--creme); color:var(--encre);
  font-family:var(--f-body); font-size:clamp(1rem,.5vw + .92rem,1.1rem);
  line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--vert); outline-offset:3px; border-radius:3px}
.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:var(--pad)}

.eyebrow{
  font-family:var(--f-body); font-weight:600; font-size:.75rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--vert); margin:0 0 1.1rem;
  display:inline-flex; align-items:center; gap:.65rem;
}
.eyebrow::before{content:"◆"; color:var(--or); font-size:.7rem}

/* ---------- HEADER ---------- */
header.site{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb,var(--creme) 88%,transparent);
  backdrop-filter:saturate(1.15) blur(10px);
  border-bottom:1px solid color-mix(in srgb,var(--encre) 10%,transparent);
}
.nav{display:flex; align-items:center; justify-content:space-between; height:80px; gap:1.5rem}
.logo-lockup{height:46px; width:auto}
.nav-links{display:flex; gap:1.9rem; font-size:.98rem; font-weight:500}
.nav-links a{position:relative; padding:.2rem 0}
.nav-links a::after{content:""; position:absolute; left:0; bottom:-3px; width:0; height:2px; background:var(--or); transition:width .25s}
.nav-links a:hover::after{width:100%}
.nav-cta{
  font-weight:600; font-size:.92rem; background:var(--vert); color:#fff;
  border-radius:999px; padding:.6rem 1.25rem; transition:background .2s, transform .15s;
}
.nav-cta:hover{background:var(--vert-fonce); transform:translateY(-1px)}
.burger{display:none; background:none; border:0; cursor:pointer; padding:.4rem}
.burger span{display:block; width:26px; height:2px; background:var(--encre); margin:5px 0; transition:.3s}

/* ---------- HERO ---------- */
.hero{position:relative; padding:clamp(3rem,8vw,6.5rem) 0 clamp(2.5rem,5vw,4rem); overflow:hidden}
.hero .wrap{position:relative; z-index:2}
.hero h1{
  font-family:var(--f-display); font-weight:900; font-optical-sizing:auto;
  font-size:clamp(2.7rem,7.5vw,6rem); line-height:.98; letter-spacing:-.02em;
  margin:.6rem 0 0; max-width:18ch;
}
.hero h1 .util{
  color:var(--vert); position:relative; white-space:nowrap;
}
.hero h1 .util::after{
  content:""; position:absolute; left:0; right:0; bottom:.06em; height:.14em;
  background:var(--or); border-radius:2px; z-index:-1;
}
.hero-sub{max-width:52ch; font-size:clamp(1.05rem,1.3vw,1.28rem); margin:1.7rem 0 0; color:color-mix(in srgb,var(--encre) 85%,transparent)}
.metiers{
  display:inline-flex; align-items:center; gap:.7rem; margin-top:1.8rem;
  font-weight:600; font-size:.95rem; color:var(--ardoise);
  border:1px solid color-mix(in srgb,var(--encre) 16%,transparent);
  border-radius:999px; padding:.5rem 1.1rem; background:color-mix(in srgb,#fff 45%,transparent);
}
.metiers .label{text-transform:uppercase; letter-spacing:.12em; font-size:.72rem}
.metiers .rotor{font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--vert); min-width:11ch}
.hero-actions{display:flex; flex-wrap:wrap; gap:1rem; margin-top:2.2rem}
.btn{
  font-weight:600; font-size:.98rem; display:inline-flex; align-items:center; gap:.6rem;
  padding:.9rem 1.6rem; border-radius:999px; cursor:pointer; border:2px solid var(--vert);
  background:var(--vert); color:#fff; transition:transform .15s, background .25s;
}
.btn:hover{transform:translateY(-2px); background:var(--vert-fonce); border-color:var(--vert-fonce)}
.btn.ghost{background:transparent; color:var(--encre); border-color:var(--encre)}
.btn.ghost:hover{background:var(--encre); color:var(--creme)}
/* emblème filigrane */
.hero-emblem{position:absolute; right:-4vw; top:50%; transform:translateY(-50%); width:min(38vw,440px); opacity:.10; z-index:1; pointer-events:none}
@media (max-width:900px){ .hero-emblem{opacity:.06; width:70vw; right:-15vw} }

/* ---------- BANDEAU métiers ---------- */
.strip{background:var(--vert-fonce); color:var(--creme); overflow:hidden; padding:1rem 0}
.marquee{display:flex; width:max-content; animation:slide 28s linear infinite; font-family:var(--f-display); font-weight:600; font-size:clamp(1.05rem,2.1vw,1.6rem)}
.marquee span{display:inline-flex; align-items:center; gap:2.4rem; white-space:nowrap; padding-right:2.4rem}
.marquee .dot{color:var(--or)}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- SECTIONS ---------- */
.section{padding:clamp(3.5rem,8vw,7rem) 0}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:2rem; flex-wrap:wrap; margin-bottom:3rem}
.section-head h2{
  font-family:var(--f-display); font-weight:900; letter-spacing:-.015em;
  font-size:clamp(2rem,4.5vw,3.3rem); line-height:1.02; margin:0; max-width:18ch;
}
.section-head p{max-width:40ch; margin:0; color:var(--ardoise)}

/* Manifeste */
.manifeste{background:var(--creme-2)}
.manifeste .big{
  font-family:var(--f-display); font-weight:500; font-style:italic;
  font-size:clamp(1.6rem,4vw,3rem); line-height:1.15; letter-spacing:-.01em; max-width:20ch; margin:0;
}
.manifeste .big b{font-style:normal; font-weight:900; color:var(--vert)}
.manifeste .who{margin:2.4rem 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1.4rem}
.manifeste .who div{border-top:2px solid var(--or); padding-top:.8rem; font-weight:600; font-size:.98rem}
.manifeste .who span{display:block; color:var(--ardoise); font-weight:400; font-size:.9rem; margin-top:.2rem}

/* Approche — 4 principes (séquence réelle) */
.dark{background:var(--vert-fonce); color:var(--creme)}
.dark .eyebrow{color:var(--or)} .dark .eyebrow::before{color:var(--or)}
.dark .section-head h2{color:var(--creme)}
.dark .section-head p{color:color-mix(in srgb,var(--creme) 72%,transparent)}
.principes{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:2rem}
.principe{position:relative; padding-top:1.6rem; border-top:2px solid color-mix(in srgb,var(--creme) 25%,transparent)}
.principe .n{font-family:var(--f-display); font-weight:900; font-size:1rem; color:var(--or)}
.principe h3{font-family:var(--f-display); font-weight:600; font-size:1.6rem; margin:.7rem 0 .5rem}
.principe p{margin:0; color:color-mix(in srgb,var(--creme) 74%,transparent); font-size:.98rem}

/* Domaines — grille filtrable */
.filters{display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:2.4rem}
.filter{
  font-weight:600; font-size:.9rem; border:1.5px solid color-mix(in srgb,var(--encre) 22%,transparent);
  background:transparent; border-radius:999px; padding:.5rem 1.15rem; cursor:pointer; color:var(--encre);
  transition:background .2s,color .2s,border-color .2s;
}
.filter:hover{border-color:var(--encre)}
.filter.active{background:var(--vert); color:#fff; border-color:var(--vert)}
.grid-dom{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.2rem}
.dom{
  background:#fff; border:1px solid color-mix(in srgb,var(--encre) 12%,transparent);
  border-radius:16px; padding:1.7rem 1.6rem 1.5rem; transition:transform .3s, box-shadow .3s, opacity .35s;
}
.dom:hover{transform:translateY(-5px); box-shadow:0 22px 44px -28px rgba(20,35,26,.5)}
.dom.hide{display:none}
.dom .tag{
  display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--vert); background:color-mix(in srgb,var(--vert) 12%,transparent); border-radius:999px;
  padding:.28rem .7rem; margin-bottom:1rem;
}
.dom h3{font-family:var(--f-display); font-weight:600; font-size:1.32rem; line-height:1.15; margin:0 0 .5rem; letter-spacing:-.01em}
.dom p{margin:0; color:var(--ardoise); font-size:.96rem}

/* Positionnement — valeurs */
.valeurs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px; background:color-mix(in srgb,var(--encre) 12%,transparent); border:1px solid color-mix(in srgb,var(--encre) 12%,transparent); border-radius:16px; overflow:hidden}
.valeur{background:var(--creme); padding:1.7rem 1.5rem; display:flex; gap:.9rem; align-items:flex-start; transition:background .25s}
.valeur:hover{background:#fff}
.valeur .ic{color:var(--or); font-size:1.1rem; line-height:1.4}
.valeur b{font-family:var(--f-display); font-weight:600; font-size:1.15rem; display:block}
.valeur span{color:var(--ardoise); font-size:.92rem}

/* Fondateur */
.fondateur{display:grid; grid-template-columns:auto 1fr; gap:2.5rem; align-items:center}
.fondateur .badge{
  width:150px; height:150px; border-radius:24px; background:var(--vert-fonce);
  display:grid; place-items:center; flex:none;
}
.fondateur .badge img{width:96px; height:auto}
.fondateur h3{font-family:var(--f-display); font-weight:900; font-size:clamp(1.6rem,3vw,2.3rem); margin:0 0 .3rem; letter-spacing:-.01em}
.fondateur .role{color:var(--vert); font-weight:600; margin:0 0 1rem}
.fondateur p{margin:0; max-width:60ch; color:color-mix(in srgb,var(--encre) 85%,transparent)}
@media (max-width:640px){ .fondateur{grid-template-columns:1fr; text-align:left} }

/* Contact */
.contact{background:var(--vert); color:#fff}
.contact h2{font-family:var(--f-display); font-weight:900; font-size:clamp(2.2rem,6vw,4.6rem); line-height:1; letter-spacing:-.02em; margin:0; max-width:16ch}
.contact .lead{max-width:46ch; margin:1.3rem 0 2.4rem; font-size:1.12rem; color:rgba(255,255,255,.92)}
.contact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1.2rem; margin-top:2.6rem}
.contact-card{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:14px; padding:1.3rem 1.4rem}
.contact-card h4{margin:0 0 .35rem; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--or)}
.contact-card p{margin:0; font-weight:600}
.contact .btn{background:#fff; color:var(--vert-fonce); border-color:#fff; margin-top:2.4rem; font-size:1.02rem; padding:1rem 1.9rem}
.contact .btn:hover{background:var(--or); color:var(--vert-fonce); border-color:var(--or)}

/* Footer */
footer.site{background:var(--encre); color:var(--creme); padding:4rem 0 2.4rem}
.foot-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2.5rem; align-items:flex-start}
.foot-logo{height:52px; width:auto; margin-bottom:1rem}
.foot-desc{max-width:34ch; color:color-mix(in srgb,var(--creme) 72%,transparent); font-size:.95rem}
.foot-cols{display:flex; gap:3.5rem; flex-wrap:wrap; font-size:.95rem}
.foot-cols h4{font-weight:700; font-size:.72rem; letter-spacing:.11em; text-transform:uppercase; color:var(--or); margin:0 0 1rem}
.foot-cols a, .foot-cols p{display:block; padding:.28rem 0; margin:0; color:color-mix(in srgb,var(--creme) 82%,transparent)}
.foot-cols a:hover{color:var(--or)}
.foot-bottom{margin-top:3rem; padding-top:1.5rem; border-top:1px solid color-mix(in srgb,var(--creme) 16%,transparent); display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem; font-size:.8rem; color:color-mix(in srgb,var(--creme) 55%,transparent)}

/* révélation */
.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s, transform .7s}
.reveal.in{opacity:1; transform:none}

/* mobile */
@media (max-width:900px){
  .nav-links,.nav-cta{display:none}
  .burger{display:block}
  .nav-links.open{display:flex; flex-direction:column; position:absolute; top:80px; left:0; right:0;
    background:var(--creme); padding:1.4rem var(--pad) 2rem; gap:1.2rem; font-size:1.15rem;
    border-bottom:1px solid color-mix(in srgb,var(--encre) 12%,transparent)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
  .reveal{opacity:1; transform:none}
}
</style>

  document.getElementById('mani-big').innerHTML =
    esc(d.manifeste.phrase_1)+'<b>'+esc(d.manifeste.gras_1)+'</b>'+
    esc(d.manifeste.phrase_2)+'<b>'+esc(d.manifeste.gras_2)+'</b>'+esc(d.manifeste.phrase_3);
  document.getElementById('mani-who').innerHTML =
    (d.manifeste.publics||[]).map(p=>'<div>'+esc(p.titre)+'<span>'+esc(p.desc)+'</span></div>').join('');

  /* APPROCHE */
  set('app-eyebrow', d.approche.eyebrow);
  set('app-titre', d.approche.titre);
  set('app-intro', d.approche.intro);
  document.getElementById('app-liste').innerHTML =
    (d.approche.principes||[]).map((p,i)=>
      '<div class="principe"><span class="n">'+String(i+1).padStart(2,'0')+
      '</span><h3>'+esc(p.nom)+'</h3><p>'+esc(p.desc)+'</p></div>').join('');

  /* DOMAINES */
  set('dom-eyebrow', d.domaines.eyebrow);
  set('dom-titre', d.domaines.titre);
  set('dom-intro', d.domaines.intro);
  document.getElementById('domGrid').innerHTML =
    (d.domaines.items||[]).map(it=>
      '<article class="dom" data-cat="'+esc(it.categorie)+'"><span class="tag">'+esc(it.tag)+
      '</span><h3>'+esc(it.titre)+'</h3><p>'+esc(it.desc)+'</p></article>').join('');

  /* POSITIONNEMENT */
  set('pos-eyebrow', d.positionnement.eyebrow);
  set('pos-titre', d.positionnement.titre);
  set('pos-intro', d.positionnement.intro);
  document.getElementById('pos-liste').innerHTML =
    (d.positionnement.valeurs||[]).map(v=>
      '<div class="valeur"><span class="ic">◆</span><div><b>'+esc(v.titre)+
      '</b><span>'+esc(v.desc)+'</span></div></div>').join('');

  /* FONDATEUR */
  set('fond-eyebrow', d.fondateur.eyebrow);
  set('fond-nom', d.fondateur.nom);
  set('fond-role', d.fondateur.role);
  set('fond-bio', d.fondateur.bio);

  /* CONTACT */
  set('cont-eyebrow', d.contact.eyebrow);
  set('cont-titre', d.contact.titre);
  set('cont-lead', d.contact.lead);
  document.getElementById('cont-cartes').innerHTML =
    (d.contact.cartes||[]).map(c=>
      '<div class="contact-card"><h4>'+esc(c.titre)+'</h4><p>'+esc(c.valeur)+'</p></div>').join('');
  const btn=document.getElementById('cont-btn');
  btn.textContent=(d.contact.bouton||'Nous écrire')+' ◆';
  btn.setAttribute('href', d.contact.email ? 'mailto:'+d.contact.email : 'mailto:');

  /* FOOTER */
  set('foot-desc', d.footer.description);
  document.getElementById('foot-contact').innerHTML =
    (d.footer.contact_lignes||[]).map(l=>'<p>'+esc(l)+'</p>').join('');
  document.getElementById('foot-fb').setAttribute('href', d.footer.facebook||'#');
  document.getElementById('foot-li').setAttribute('href', d.footer.linkedin||'#');
  var _yt=document.getElementById('foot-yt');
  if(d.footer.youtube && d.footer.youtube!=='#'){ _yt.setAttribute('href', d.footer.youtube); _yt.style.display=''; }
  else { _yt.style.display='none'; }
  set('foot-copy', d.footer.copyright);

  wireUp(d);
}

function wireUp(d){
  /* rotation des métiers */
  const metiers=d.metiers||[]; const el=document.getElementById('rotor'); let i=0;
  if(el && metiers.length>1 && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    setInterval(()=>{ i=(i+1)%metiers.length; el.style.opacity=0;
      setTimeout(()=>{ el.textContent=metiers[i]; el.style.transition='opacity .3s'; el.style.opacity=1; },200);
    },2400);
  }
  /* filtres domaines */
  const filters=document.querySelectorAll('.filter');
  const cards=document.querySelectorAll('#domGrid .dom');
  filters.forEach(b=>b.addEventListener('click',()=>{
    filters.forEach(f=>f.classList.remove('active')); b.classList.add('active');
    const c=b.dataset.cat;
    cards.forEach(card=>card.classList.toggle('hide', !(c==='all'||card.dataset.cat===c)));
  }));
  /* menu mobile */
  const burger=document.getElementById('burger'), menu=document.getElementById('menu');
  burger.addEventListener('click',()=>{const o=menu.classList.toggle('open'); burger.setAttribute('aria-expanded',o);});
  menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('open'); burger.setAttribute('aria-expanded','false');}));
  /* révélation au scroll */
  const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
}

/* On tente de charger content.json (modifiable via /admin) ; sinon on utilise le repli. */
fetch('content.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>render(d))
  .catch(()=>render(DEFAULTS));
</script>
